<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="cyberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#4facfe" />
      <stop offset="100%" stop-color="#7928ca" />
    </linearGradient>
    <linearGradient id="neonGlow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7928ca" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0.9" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Outer Hexagonal Prism Frame -->
  <polygon points="100,16 172,58 172,142 100,184 28,142 28,58" 
           fill="none" stroke="url(#cyberGrad)" stroke-width="3" filter="url(#glow)" opacity="0.85"/>
  <polygon points="100,16 172,58 172,142 100,184 28,142 28,58" 
           fill="rgba(10, 14, 28, 0.4)" stroke="#00f2fe" stroke-width="1.5" opacity="0.9"/>

  <!-- Inner Neural Constellation Network -->
  <line x1="100" y1="16" x2="100" y2="184" stroke="url(#cyberGrad)" stroke-width="1.2" stroke-dasharray="4 3" opacity="0.5"/>
  <line x1="28" y1="58" x2="172" y2="142" stroke="url(#cyberGrad)" stroke-width="1.2" opacity="0.35"/>
  <line x1="28" y1="142" x2="172" y2="58" stroke="url(#cyberGrad)" stroke-width="1.2" opacity="0.35"/>
  <line x1="28" y1="58" x2="172" y2="58" stroke="url(#cyberGrad)" stroke-width="1" opacity="0.25"/>
  <line x1="28" y1="142" x2="172" y2="142" stroke="url(#cyberGrad)" stroke-width="1" opacity="0.25"/>

  <!-- Futuristic Stylized "H" Glyph with 3D Bevel -->
  <!-- Left Pillar of H -->
  <path d="M 64,55 L 80,46 L 80,154 L 64,145 Z" fill="url(#neonGlow)" filter="url(#glow)" opacity="0.95"/>
  <path d="M 64,55 L 72,50 L 72,150 L 64,145 Z" fill="#00f2fe" opacity="0.8"/>
  
  <!-- Right Pillar of H -->
  <path d="M 120,46 L 136,55 L 136,145 L 120,154 Z" fill="url(#neonGlow)" filter="url(#glow)" opacity="0.95"/>
  <path d="M 128,50 L 136,55 L 136,145 L 128,150 Z" fill="#7928ca" opacity="0.8"/>

  <!-- Central Neural Bridge -->
  <polygon points="76,94 124,94 120,106 80,106" fill="url(#cyberGrad)" filter="url(#glow)"/>
  <polygon points="76,94 124,94 120,106 80,106" fill="#ffffff" opacity="0.6"/>

  <!-- Glowing Central AI Core Synapse -->
  <circle cx="100" cy="100" r="10" fill="url(#cyberGrad)" filter="url(#glow)"/>
  <circle cx="100" cy="100" r="5" fill="#ffffff"/>

  <!-- Node points -->
  <circle cx="100" cy="16" r="3.5" fill="#00f2fe" filter="url(#glow)"/>
  <circle cx="172" cy="58" r="3.5" fill="#7928ca" filter="url(#glow)"/>
  <circle cx="172" cy="142" r="3.5" fill="#00f2fe" filter="url(#glow)"/>
  <circle cx="100" cy="184" r="3.5" fill="#7928ca" filter="url(#glow)"/>
  <circle cx="28" cy="142" r="3.5" fill="#00f2fe" filter="url(#glow)"/>
  <circle cx="28" cy="58" r="3.5" fill="#7928ca" filter="url(#glow)"/>
</svg>
