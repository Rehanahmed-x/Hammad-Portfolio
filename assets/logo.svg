<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Cyan to Deep Sky Gradient -->
    <linearGradient id="gvCyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="50%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <!-- Emerald to Neon Cyan Gradient -->
    <linearGradient id="gvEmeraldGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="60%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>

    <!-- Deep Facet Shadow Gradient -->
    <linearGradient id="gvFacetDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#020617" stop-opacity="0.95" />
    </linearGradient>

    <!-- Glowing Filter -->
    <filter id="gvGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Outer Hexagonal Prism Armor -->
  <polygon points="100,14 174,56 174,144 100,186 26,144 26,56" 
           fill="url(#gvFacetDark)" stroke="url(#gvCyanGrad)" stroke-width="2.5" filter="url(#gvGlow)"/>

  <!-- Subtle Inner Geometric Grid / Nexus Lines -->
  <line x1="100" y1="14" x2="100" y2="186" stroke="#00f0ff" stroke-width="1" stroke-dasharray="4 3" opacity="0.3"/>
  <line x1="26" y1="56" x2="174" y2="144" stroke="#00f0ff" stroke-width="1" opacity="0.2"/>
  <line x1="26" y1="144" x2="174" y2="56" stroke="#00f0ff" stroke-width="1" opacity="0.2"/>

  <!-- Stylized Greekvex Monogram: Bold "G" and "V" (Greek Vertex) -->
  <!-- Top Bar & Arc of 'G' -->
  <path d="M 148,60 L 100,32 L 52,60 L 52,140 L 100,168 L 148,140 L 148,102 L 102,102 L 102,118 L 132,118 L 132,130 L 100,148 L 70,131 L 70,69 L 100,52 L 130,69 L 142,62 Z" 
        fill="url(#gvCyanGrad)" filter="url(#gvGlow)" opacity="0.95"/>

  <!-- The Inset Dynamic 'V' (Vertex Apex) Cutting Through Core -->
  <polygon points="100,68 132,124 116,124 100,94 84,124 68,124" 
           fill="url(#gvEmeraldGrad)" filter="url(#gvGlow)"/>

  <!-- Central Luminous Neural Node -->
  <circle cx="100" cy="100" r="7" fill="#00f0ff" filter="url(#gvGlow)"/>
  <circle cx="100" cy="100" r="3.5" fill="#ffffff"/>

  <!-- Corner Vertex Accents -->
  <circle cx="100" cy="14" r="3" fill="#00f0ff"/>
  <circle cx="174" cy="56" r="3" fill="#00f0ff"/>
  <circle cx="174" cy="144" r="3" fill="#10b981"/>
  <circle cx="100" cy="186" r="3" fill="#10b981"/>
  <circle cx="26" cy="144" r="3" fill="#10b981"/>
  <circle cx="26" cy="56" r="3" fill="#00f0ff"/>
</svg>
